<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" role="img" aria-labelledby="title desc">
  <title id="title">Dark mode graphic</title>
  <desc id="desc">A dark-themed abstract SVG panel.</desc>

  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#020817"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="800" height="200" fill="url(#bg)"/>
  <circle cx="620" cy="50" r="120" fill="#1f2937" opacity="0.9"/>
  <circle cx="690" cy="110" r="150" fill="url(#accent)" opacity="0.22"/>
  <circle cx="150" cy="60" r="90" fill="#0ea5e9" opacity="0.14"/>

  <g fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1">
    <path d="M0 30 H800"/>
    <path d="M0 170 H800"/>
    <path d="M110 0 V200"/>
    <path d="M690 0 V200"/>
  </g>

  <g>
    <rect x="60" y="48" width="180" height="104" rx="18" fill="#111827" stroke="#374151"/>
    <circle cx="98" cy="90" r="18" fill="#22d3ee" opacity="0.9"/>
    <rect x="128" y="80" width="72" height="10" rx="5" fill="#e5e7eb" opacity="0.9"/>
    <rect x="128" y="100" width="90" height="10" rx="5" fill="#94a3b8" opacity="0.9"/>
    <rect x="128" y="120" width="56" height="10" rx="5" fill="#94a3b8" opacity="0.7"/>
  </g>

  <g fill="#f8fafc" font-family="Arial, Helvetica, sans-serif">
    <text x="290" y="90" font-size="42" font-weight="700">Dark Mode</text>
    <text x="292" y="125" font-size="20" fill="#cbd5e1">Clean, focused, and ready.</text>
  </g>
</svg>
